<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none" width="100%" height="100%">
  <defs>
    <!-- Ruby Rose Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Warm Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(15, 12)" filter="url(#softGlow)">
    <!-- Outer Rounded Square Frame -->
    <rect x="0" y="0" width="116" height="116" rx="28" fill="url(#roseGrad)" />
    
    <!-- Subtle Inner Gold Border -->
    <rect x="3" y="3" width="110" height="110" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />

    <!-- Shopping Bag Body with Curved Cut -->
    <path d="M36 48 C36 44, 40 40, 44 40 L72 40 C76 40, 80 44, 80 48 L86 90 C86 94.5, 82.5 98, 78 98 L38 98 C33.5 98, 30 94.5, 30 90 Z" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Bag Handle with Arch -->
    <path d="M47 43 V32 C47 24, 69 24, 69 32 V43" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Stylized Crown / "M" Floral Monogram inside bag -->
    <path d="M43 78 L51 54 L58 68 L65 54 L73 78" fill="none" stroke="url(#roseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sparkle Diamond -->
    <path d="M78 30 L80 24 L82 30 L88 32 L82 34 L80 40 L78 34 L72 32 Z" fill="url(#goldGrad)" />
  </g>

  <!-- TEXT BRANDING -->
  <g transform="translate(150, 20)">
    <!-- MAYA Main Title -->
    <text x="0" y="56" font-family="'Inter', 'Playfair Display', 'Hind Siliguri', sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#roseGrad)">
      MAYA
    </text>

    <!-- SHOPPING MALL Subtitle -->
    <text x="3" y="85" font-family="'Inter', 'Hind Siliguri', sans-serif" font-size="16" font-weight="800" letter-spacing="7" fill="url(#goldGrad)">
      SHOPPING MALL
    </text>

    <!-- Bengali Tagline -->
    <text x="4" y="105" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" fill="#64748B">
      মায়া শপিং মল • নওগাঁর বিশ্বস্ত লাইফস্টাইল শপ
    </text>
  </g>
</svg>
